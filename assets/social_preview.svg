<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%" fx="40%" fy="20%">
      <stop offset="0%" stop-color="#261a12" />
      <stop offset="50%" stop-color="#14100d" />
      <stop offset="100%" stop-color="#0c0a08" />
    </radialGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#221b15" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#17120e" stop-opacity="0.98" />
    </linearGradient>

    <!-- Warm Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-opacity="0.07" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Warm Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="190" fill="#f59e0b" opacity="0.18" filter="url(#glow)" />
  <circle cx="1020" cy="380" r="220" fill="#ea580c" opacity="0.15" filter="url(#glow)" />

  <!-- Outer Card Frame -->
  <rect x="50" y="40" width="1100" height="550" rx="24" fill="none" stroke="#f59e0b" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Top Navigation / Studio Tag -->
  <g transform="translate(90, 85)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#1c1611" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#f59e0b" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#d6cebe" letter-spacing="1.5">EXISTENTIAL CLOUD</text>
  </g>

  <!-- Official Badge -->
  <g transform="translate(325, 85)">
    <rect x="0" y="0" width="120" height="34" rx="17" fill="#451a03" stroke="#ea580c" stroke-width="1" />
    <text x="60" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fed7aa" text-anchor="middle">OFFICIAL PORTAL</text>
  </g>

  <!-- Main Title Area -->
  <text x="90" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="900" fill="#faf5ee" letter-spacing="-1">
    Existential Cloud
  </text>
  <text x="90" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#warmGrad)" letter-spacing="-0.5">
    Engineering the Agentic Substrate.
  </text>

  <!-- Subtitle -->
  <text x="90" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#a89f91">
    Home of mcp-mesh, mcp-mesh-eval, and the 1 + 3 + N autonomous AI architecture.
  </text>

  <!-- Feature Grid Metric Cards -->
  <g transform="translate(90, 365)">
    <!-- Card 1: Flagship mcp-mesh -->
    <g transform="translate(0, 0)">
      <rect width="235" height="135" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#451a03" />
      <text x="38" y="44" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#f59e0b">🌐</text>
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" fill="#f59e0b">mcp-mesh</text>
      <text x="18" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#a89f91">Dynamic MCP Gateway</text>
    </g>

    <!-- Card 2: mcp-mesh-eval -->
    <g transform="translate(260, 0)">
      <rect width="235" height="135" rx="16" fill="url(#cardGrad)" stroke="#ea580c" stroke-opacity="0.25" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#3b1d0e" />
      <text x="38" y="44" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#ea580c">📊</text>
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" fill="#ea580c">mcp-mesh-eval</text>
      <text x="18" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#a89f91">Empirical Benchmark</text>
    </g>

    <!-- Card 3: 1 + 3 + N Studio -->
    <g transform="translate(520, 0)">
      <rect width="235" height="135" rx="16" fill="url(#cardGrad)" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#422006" />
      <text x="38" y="44" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#fbbf24">🏛️</text>
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" fill="#fbbf24">1 + 3 + N</text>
      <text x="18" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#a89f91">Interconnected System</text>
    </g>

    <!-- Card 4: 90% Savings -->
    <g transform="translate(780, 0)">
      <rect width="235" height="135" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#2e1a0d" />
      <text x="38" y="44" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#fde68a">⚡</text>
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" fill="#fde68a">85%–95%</text>
      <text x="18" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#a89f91">Prompt Token Reduction</text>
    </g>
  </g>

  <!-- Bottom Bar: Creator Info & Live Link -->
  <g transform="translate(90, 545)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#a89f91">
      Founded by <tspan fill="#faf5ee">Van Schulist</tspan> (@VanSchulist)
    </text>
    <text x="1020" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f59e0b" text-anchor="end">
      www.existentialcloud.ccwu.cc
    </text>
  </g>
</svg>
